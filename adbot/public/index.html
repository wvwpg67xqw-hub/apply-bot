<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #0d0f1a; }
    .topbar { background: #111326; border-bottom: 1px solid #1e2442; }
    .card { background: #161b2e; border: 1px solid #1e2442; transition: border-color 0.15s; }
    .card:hover { border-color: #5865F2; }
    .badge-staff   { background: #4a1942; color: #e879f9; }
    .badge-main    { background: #14372a; color: #4ade80; }
    .badge-network { background: #1e2c4a; color: #60a5fa; }
    .btn-configure { background: #5865F2; }
    .btn-configure:hover { background: #4752c4; }
    .tab-active   { color: white; border-bottom: 2px solid #5865F2; }
    .tab-inactive { color: #6b7280; border-bottom: 2px solid transparent; }
  </style>
</head>
<body class="min-h-screen text-white">

  <!-- Top Bar -->
  <header class="topbar px-4 py-3 flex items-center gap-3">
    <div class="w-8 h-8 rounded-full bg-indigo-600 flex items-center justify-center text-lg">🤖</div>
    <span class="font-semibold text-white text-sm">Staff Dashboard</span>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-8">
    <div class="mb-6">
      <h1 class="text-2xl font-bold text-white">Your Servers</h1>
      <p class="text-gray-400 text-sm mt-1">All servers the bot is in</p>
    </div>

    <!-- Filter Tabs -->
    <div class="flex gap-6 border-b border-gray-800 mb-6 overflow-x-auto">
      <button class="tab pb-3 text-sm font-medium tab-active flex-shrink-0" data-filter="all">All</button>
      <button class="tab pb-3 text-sm font-medium tab-inactive flex-shrink-0" data-filter="staff">Staff</button>
      <button class="tab pb-3 text-sm font-medium tab-inactive flex-shrink-0" data-filter="main">Main</button>
      <button class="tab pb-3 text-sm font-medium tab-inactive flex-shrink-0" data-filter="network">Network</button>
    </div>

    <div id="loading" class="text-center py-16 text-gray-500">
      <div class="text-4xl mb-3">⏳</div>
      <p>Loading servers…</p>
    </div>

    <div id="empty" class="text-center py-16 text-gray-500 hidden">
      <div class="text-4xl mb-3">🔍</div>
      <p>No servers for this filter</p>
    </div>

    <div id="guild-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 hidden"></div>
  </main>

  <script>
    let allGuilds = [];
    let activeFilter = 'all';

    async function init() {
      try {
        const guilds = await fetch('/api/guilds').then(r => r.json());
        allGuilds = guilds;
        renderGuilds();
      } catch (err) {
        document.getElementById('loading').innerHTML = '<p class="text-red-400">Failed to load servers. Is the bot running?</p>';
      }
    }

    function renderGuilds() {
      const filtered = activeFilter === 'all' ? allGuilds : allGuilds.filter(g => g.type === activeFilter);
      const grid     = document.getElementById('guild-grid');
      const loading  = document.getElementById('loading');
      const empty    = document.getElementById('empty');

      loading.classList.add('hidden');

      if (filtered.length === 0) {
        grid.classList.add('hidden');
        empty.classList.remove('hidden');
        return;
      }

      empty.classList.add('hidden');
      grid.classList.remove('hidden');
      grid.innerHTML = filtered.map(guildCard).join('');
    }

    function guildCard(g) {
      const iconUrl  = g.icon ? `https://cdn.discordapp.com/icons/${g.id}/${g.icon}.png?size=128` : null;
      const initials = g.name.split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase();
      const badgeClass = `badge-${g.type}`;
      const badgeLabel = g.type.charAt(0).toUpperCase() + g.type.slice(1);
      const memberText = g.memberCount ? `${g.memberCount.toLocaleString()} members` : '';

      return `
        <div class="card rounded-2xl p-5 flex flex-col gap-4 cursor-pointer" onclick="window.location='/server.html?id=${g.id}'">
          <div class="flex items-center gap-4">
            ${iconUrl
              ? `<img src="${iconUrl}" alt="${esc(g.name)}" class="w-14 h-14 rounded-full flex-shrink-0" onerror="this.outerHTML='<div class=\\"w-14 h-14 rounded-full bg-indigo-600 flex items-center justify-center font-bold text-white text-lg flex-shrink-0\\">${initials}</div>'">`
              : `<div class="w-14 h-14 rounded-full bg-indigo-600 flex items-center justify-center font-bold text-white text-lg flex-shrink-0">${initials}</div>`
            }
            <div class="min-w-0 flex-1">
              <div class="font-semibold text-white truncate">${esc(g.name)}</div>
              ${memberText ? `<div class="text-gray-500 text-xs mt-0.5">${memberText}</div>` : ''}
              <span class="${badgeClass} text-xs font-medium px-2 py-0.5 rounded-full mt-1 inline-block">${badgeLabel} Server</span>
            </div>
          </div>
          <button class="btn-configure w-full text-white text-sm font-semibold py-2 rounded-lg transition-colors">Configure →</button>
        </div>`;
    }

    function esc(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => { t.className = t.className.replace('tab-active','tab-inactive'); });
        tab.className = tab.className.replace('tab-inactive','tab-active');
        activeFilter = tab.dataset.filter;
        renderGuilds();
      });
    });

    init();
  </script>
</body>
</html>
